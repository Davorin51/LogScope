name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=logscope --cov-report=term-missing
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist logscope-cli
      - run: python -m logscope analyze examples --rules examples/rules.yaml --json report.json --html report.html
      - uses: actions/upload-artifact@v4
        with:
          name: demo-reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            report.json
            report.html
